version: 0.2

phases:
  install:
    commands:
      - which terraform || (curl -o terraform.zip https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip && unzip -o terraform.zip && mv terraform /usr/local/bin/)
      - terraform -version
  build:
    commands:
      - cd terraform
      - terraform init -input=false
      - terraform apply -input=false -auto-approve tfplan

artifacts:
  files:
    - '**/*'