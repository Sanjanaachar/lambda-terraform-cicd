version: 0.2

phases:
  install:
    commands:
      - curl -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip
      - unzip -o /tmp/terraform.zip -d /tmp/terraform-bin
      - mv /tmp/terraform-bin/terraform /usr/local/bin/terraform
      - terraform -version
  build:
    commands:
      - cd terraform
      - terraform init -input=false
      - terraform apply -input=false -auto-approve tfplan

artifacts:
  files:
    - '**/*'